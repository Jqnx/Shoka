name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install libvips headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Run tests
        working-directory: backend
        run: go test -tags sqlite_fts5 ./...

  frontend:
    name: Frontend (check + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Lint and format check
        run: npm run lint
      - name: Build
        env:
          DATABASE_URL: /tmp/build-placeholder.db
          BETTER_AUTH_SECRET: buildtimeplaceholderbuildtimeplaceholder
          ORIGIN: http://localhost:3000
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag shoka:ci .
