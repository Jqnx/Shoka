version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries"
    schema: "../frontend/db/migrations"
    gen:
      go:
        emit_json_tags: true
        emit_pointers_for_null_types: true
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
