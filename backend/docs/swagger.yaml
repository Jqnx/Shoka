basePath: /
definitions:
  handlers.ArchiveListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ArchiveResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.ArchiveResponse:
    properties:
      artists:
        items:
          type: string
        type: array
      category:
        type: string
      characters:
        items:
          type: string
        type: array
      circles:
        items:
          type: string
        type: array
      created_at:
        type: string
      file_path:
        type: string
      id:
        type: string
      is_favorited:
        type: boolean
      language:
        type: string
      page_count:
        type: integer
      parodies:
        items:
          type: string
        type: array
      progress:
        $ref: '#/definitions/handlers.ProgressResponse'
      rating:
        type: integer
      release_date:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      thumbs_ready:
        type: boolean
      title:
        type: string
      updated_at:
        type: string
    type: object
  handlers.ArtistListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ArtistResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.ArtistResponse:
    properties:
      aliases:
        items:
          type: string
        type: array
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  handlers.BulkFailure:
    properties:
      error:
        type: string
      id:
        type: string
    type: object
  handlers.BulkMetadataRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      source:
        description: |-
          Source optionally pins the fetch to one named metadata source
          (comicinfo, filename, e-hentai, nhentai). Omit it to run the normal
          priority-ordered pipeline.
        type: string
    type: object
  handlers.BulkProgressRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      read:
        description: |-
          Read true marks every archive finished (its own last page); false
          clears progress entirely, the same as DELETE .../{id}/progress.
        type: boolean
    type: object
  handlers.BulkResult:
    properties:
      failed:
        items:
          $ref: '#/definitions/handlers.BulkFailure'
        type: array
      requested:
        type: integer
      succeeded:
        type: integer
    type: object
  handlers.BulkUpdateArchivesRequest:
    properties:
      artists:
        items:
          type: string
        type: array
      category:
        type: string
      characters:
        items:
          type: string
        type: array
      circles:
        items:
          type: string
        type: array
      ids:
        items:
          type: string
        type: array
      language:
        type: string
      parodies:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
    type: object
  handlers.CharacterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.CharacterResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.CharacterResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.CreateArtistRequest:
    properties:
      aliases:
        items:
          type: string
        type: array
      name:
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  handlers.CreateLibraryRequest:
    properties:
      name:
        type: string
      path:
        type: string
      type:
        type: string
    type: object
  handlers.DuplicateArchive:
    properties:
      distance:
        description: |-
          Distance is the mean per-point Hamming distance to whichever *other*
          member of the group this archive matches most closely - lower means
          more visually similar. In a chained group (A close to B, B close to C)
          this reports the real match, not the distance to an arbitrary anchor.
        type: integer
      distances:
        additionalProperties:
          type: integer
        description: |-
          Distances breaks that down per sample point (p0 = cover, p25/p50/p75 =
          that fraction through the archive), against that same closest member.
          Points either archive hasn't hashed are omitted rather than reported
          as 0.
        type: object
      id:
        type: string
      library_id:
        type: string
      title:
        type: string
    type: object
  handlers.DuplicateGroup:
    properties:
      archives:
        items:
          $ref: '#/definitions/handlers.DuplicateArchive'
        type: array
    type: object
  handlers.JobSnapshot:
    properties:
      active:
        description: |-
          Active is pending + running jobs, running first. Capped at
          maxActiveJobs - Counts reports the true totals.
        items:
          $ref: '#/definitions/handlers.JobView'
        type: array
      counts:
        additionalProperties:
          format: int64
          type: integer
        description: Counts is keyed by status and always contains all four statuses.
        type: object
      recent_failures:
        items:
          $ref: '#/definitions/handlers.JobView'
        type: array
    type: object
  handlers.JobView:
    properties:
      attempts:
        type: integer
      created_at:
        type: string
      error:
        type: string
      id:
        type: integer
      max_attempts:
        type: integer
      status:
        type: string
      target:
        description: |-
          Target is a human-readable description of what the job acts on,
          derived from its payload - e.g. "archive:a3f9..." or "library:main".
          Empty when the payload has no recognisable target.
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  handlers.LanguageResponse:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  handlers.LibraryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      path:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  handlers.LibrarySourceResponse:
    properties:
      api_key:
        type: string
      cookies:
        type: string
      enabled:
        type: boolean
      magazine_blocklist:
        items:
          type: string
        type: array
      misc_blocklist:
        items:
          type: string
        type: array
      source:
        type: string
    type: object
  handlers.LibraryTypeResponse:
    properties:
      supported:
        type: boolean
      type:
        type: string
    type: object
  handlers.ParodyListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ParodyResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.ParodyResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.ProgressResponse:
    properties:
      completed:
        type: boolean
      current_page:
        type: integer
      last_read:
        type: string
    type: object
  handlers.ReaderSettingsResponse:
    properties:
      background:
        type: string
      fit_mode:
        type: string
      page_layout:
        type: string
      reading_direction:
        type: string
      view_mode:
        type: string
    type: object
  handlers.SearchArchiveResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ArchiveResponse'
        type: array
      total:
        type: integer
    type: object
  handlers.SearchEntityResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.SearchEntityResult'
        type: array
      total:
        type: integer
    type: object
  handlers.SearchEntityResult:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.SearchResponse:
    properties:
      archives:
        $ref: '#/definitions/handlers.SearchArchiveResponse'
      artists:
        $ref: '#/definitions/handlers.SearchEntityResponse'
      characters:
        $ref: '#/definitions/handlers.SearchEntityResponse'
      circles:
        $ref: '#/definitions/handlers.SearchEntityResponse'
      parodies:
        $ref: '#/definitions/handlers.SearchEntityResponse'
      tags:
        $ref: '#/definitions/handlers.SearchEntityResponse'
    type: object
  handlers.SetRatingRequest:
    properties:
      rating:
        description: |-
          Rating is 1-5, matching a classic 5-star rating widget. There's no
          0/"unset" value here — clearing a rating is DELETE .../rating.
        type: integer
    type: object
  handlers.SortOptionResponse:
    properties:
      display_name:
        type: string
      value:
        type: string
    type: object
  handlers.TagListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.TagResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.TagResponse:
    properties:
      count:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.UpdateArchiveRequest:
    properties:
      artists:
        items:
          type: string
        type: array
      category:
        type: string
      characters:
        items:
          type: string
        type: array
      circles:
        items:
          type: string
        type: array
      language:
        type: string
      parodies:
        items:
          type: string
        type: array
      release_date:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handlers.UpdateArtistRequest:
    properties:
      aliases:
        description: |-
          Aliases/URLs: omit to leave unchanged, send [] to clear, or send a
          full list to replace it entirely.
        items:
          type: string
        type: array
      name:
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateLibraryRequest:
    properties:
      name:
        type: string
    type: object
  handlers.UpdateLibrarySourceRequest:
    properties:
      api_key:
        type: string
      cookies:
        type: string
      enabled:
        type: boolean
      magazine_blocklist:
        items:
          type: string
        type: array
      misc_blocklist:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateProgressRequest:
    properties:
      completed:
        description: |-
          Completed: omit to auto-derive (true once page reaches the archives
          last page), or set explicitly to override that (e.g. letting a user
          mark something finished/unfinished regardless of page position).
        type: boolean
      page:
        type: integer
    type: object
  handlers.UpdateReaderSettingsRequest:
    properties:
      background:
        type: string
      fit_mode:
        type: string
      page_layout:
        type: string
      reading_direction:
        type: string
      view_mode:
        type: string
    type: object
  handlers.UpdateTagDescriptionRequest:
    properties:
      description:
        type: string
    type: object
  metadata.Result:
    properties:
      artists:
        items:
          type: string
        type: array
      category:
        type: string
      characters:
        items:
          type: string
        type: array
      circles:
        items:
          type: string
        type: array
      language:
        type: string
      page_count:
        type: integer
      parodies:
        items:
          type: string
        type: array
      release_date:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  metadata.SearchResult:
    properties:
      cover_url:
        type: string
      full:
        allOf:
        - $ref: '#/definitions/metadata.Result'
        description: |-
          Full is populated lazily when the user selects this result.
          Nil until FetchByID is called.
      id:
        type: string
      language:
        type: string
      page_count:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  metadata.SourceInfo:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      priority:
        type: integer
    type: object
  response.Error:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Self-hosted doujinshi library manager API
  title: Shoka API
  version: "1.0"
paths:
  /api/admin/covers:
    post:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Enqueue cover generation for all archives
      tags:
      - admin
  /api/admin/duplicates:
    get:
      description: Cross-library maintenance action, like /admin/covers. Compares
        archives at four sample points (the cover plus 25/50/75% through the pages)
        and groups pairs where a majority of comparable points are within threshold
        - so a match has to hold across the body of the work, not just its cover.
        Groups are connected components (A close to B, B close to C groups all three
        even if A and C aren't directly close), so treat larger groups as progressively
        less certain. Archives the phash job hasn't processed yet are silently skipped.
        Note that positional sampling assumes the two archives' page counts roughly
        line up; a release padded with many extra pages can still slip through.
      parameters:
      - default: 8
        description: Max per-point Hamming distance (0-20) for a sample point to count
          as matching
        in: query
        name: threshold
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.DuplicateGroup'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Find likely-duplicate archives by perceptual hash
      tags:
      - admin
  /api/admin/jobs:
    get:
      description: Status counts across the whole queue, plus the currently pending/running
        jobs and the most recent failures. Point-in-time - see GET /api/admin/jobs/events
        to follow it live.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.JobSnapshot'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a snapshot of the job queue
      tags:
      - admin
  /api/admin/jobs/events:
    get:
      description: Server-Sent Events. Emits a "snapshot" event ({counts, active,
        recent_failures}, same shape as GET /api/admin/jobs) immediately on connect,
        then again whenever the queue changes. Polls once a second, matching the workers'
        own tick, so a job that starts and finishes inside one interval may never
        be observed as running - the counts still account for it. Identical consecutive
        snapshots are suppressed; a comment heartbeat keeps idle connections alive.
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Stream job queue activity
      tags:
      - admin
  /api/admin/libraries:
    post:
      consumes:
      - application/json
      parameters:
      - description: Library to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateLibraryRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Create a library
      tags:
      - admin
  /api/admin/libraries/{id}:
    delete:
      description: Cascade-deletes every archive and cached data belonging to this
        library. Does not touch files on disk.
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete a library
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: The library's path and type are immutable after creation.
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateLibraryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Rename a library
      tags:
      - admin
  /api/admin/libraries/{id}/scan:
    post:
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Trigger a scan of a single library
      tags:
      - admin
  /api/admin/libraries/{id}/sources:
    get:
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LibrarySourceResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a library's per-library metadata source settings
      tags:
      - admin
  /api/admin/libraries/{id}/sources/{source}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name (e.g. nhentai, e-hentai, comicinfo, filename)
        in: path
        name: source
        required: true
        type: string
      - description: Source settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateLibrarySourceRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LibrarySourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Configure a metadata source for a single library
      tags:
      - admin
  /api/admin/phashes:
    post:
      description: Backfills the hashes GET /api/admin/duplicates compares. Safe to
        re-run - each job overwrites that archive's hashes in place, so this is also
        how you re-hash the library after a change to which pages get sampled.
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Enqueue perceptual-hash computation for all archives
      tags:
      - admin
  /api/archives:
    get:
      parameters:
      - description: Library ID to list archives from
        in: query
        name: library_id
        required: true
        type: string
      - description: Full-text search over title, summary, artists, tags, parodies,
          circles, characters, category (substring match, min 3 characters - shorter
          values are ignored)
        in: query
        name: q
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 24
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Sort order (title_asc, title_desc, release_date_asc, release_date_desc,
          created_at_asc, created_at_desc, page_count_asc, page_count_desc, rating_asc,
          rating_desc)
        in: query
        name: sort
        type: string
      - collectionFormat: csv
        description: Filter by artist name(s); archive must have all
        in: query
        items:
          type: string
        name: artist
        type: array
      - collectionFormat: csv
        description: Filter by tag name(s); archive must have all
        in: query
        items:
          type: string
        name: tag
        type: array
      - collectionFormat: csv
        description: Filter by character name(s); archive must have all
        in: query
        items:
          type: string
        name: character
        type: array
      - collectionFormat: csv
        description: Filter by parody name(s); archive must have all
        in: query
        items:
          type: string
        name: parody
        type: array
      - description: Filter by language code (e.g. en, ja)
        in: query
        name: language
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by whether the archive has been perceptually hashed (for
          duplicate detection). Omit to include both.
        in: query
        name: has_phash
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List archives with pagination, filtering, and sorting
      tags:
      - archives
  /api/archives/{id}:
    delete:
      description: Removes the archive and all its associated data (progress, favorites,
        ratings, metadata) from the library. By default the underlying file on disk
        is left untouched — pass delete_file=true to also remove it. Cache/thumbnail
        data is always evicted.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - default: false
        description: Also delete the archive file from disk
        in: query
        name: delete_file
        type: boolean
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete an archive
      tags:
      - archives
    patch:
      consumes:
      - application/json
      description: Partial update of an archive's metadata, including relations (artists/tags/parodies/circles/characters).
        This is a direct manual edit, not a metadata source — a subsequent "fetch
        metadata" call can still overwrite these values, there is currently no per-field
        locking.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateArchiveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Update an archive
      tags:
      - archives
  /api/archives/{id}/cover:
    get:
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get the cover thumbnail for an archive
      tags:
      - archives
  /api/archives/{id}/favorite:
    delete:
      description: Removes the archive from the current users favorites. No-op if
        it wasn't favorited.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Unfavorite an archive
      tags:
      - archives
    put:
      description: Idempotent - adds the archive to the current users favorites. No-op
        if already favorited.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Favorite an archive
      tags:
      - archives
  /api/archives/{id}/pages/{index}:
    get:
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Page index (0-based)
        in: path
        name: index
        required: true
        type: integer
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a full-resolution page for an archive
      tags:
      - archives
  /api/archives/{id}/pages/{index}/thumbnail:
    get:
      description: Read-only — serves a thumbnail only if it has already been generated.
        Does not trigger generation; call POST .../thumbnails for that.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Page index (0-based)
        in: path
        name: index
        required: true
        type: integer
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a page's thumbnail for an archive
      tags:
      - archives
  /api/archives/{id}/progress:
    delete:
      description: Removes the current users reading progress for this archive entirely
        (as opposed to setting page back to 0, which would still count as "in progress").
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Reset reading progress for an archive
      tags:
      - archives
    put:
      consumes:
      - application/json
      description: Upserts the current users reading progress. Idempotent - safe to
        call on every page turn with the new absolute page number.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Progress
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProgressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProgressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Record reading progress for an archive
      tags:
      - archives
  /api/archives/{id}/rating:
    delete:
      description: Removes the current users star rating for this archive. No-op if
        it wasn't rated.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Clear an archive's rating
      tags:
      - archives
    put:
      consumes:
      - application/json
      description: Idempotent - sets the current users star rating (1-5) for this
        archive, overwriting any previous rating.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Rating
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SetRatingRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Rate an archive
      tags:
      - archives
  /api/archives/{id}/thumbnails:
    post:
      description: Enqueues background generation of this archive's per-page thumbnails
        and returns immediately. Safe to call repeatedly — a job already pending/running
        for this archive is not duplicated. This is the only thing that triggers thumbnail
        generation; the GET endpoints only ever serve what already exists, so simply
        fetching a thumbnail URL (e.g. from curl/Postman) can't spin up generation
        work. Intended to be called by the frontend when a user opens an archive.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: generation started
        "204":
          description: thumbnails already ready
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Trigger thumbnail generation for an archive
      tags:
      - archives
  /api/archives/{id}/thumbnails/events:
    get:
      description: 'Server-Sent Events. Emits a "ready" event ({"index": N}) for each
        page thumbnail as it becomes available — including an immediate snapshot of
        pages already ready when the connection opens — followed by a terminal "done"
        event ({"done": true} on success, {"done": true, "error": "..."} if generation
        permanently failed after exhausting retries). Read-only: does not trigger
        generation, call POST .../thumbnails for that.'
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Stream thumbnail generation progress
      tags:
      - archives
  /api/archives/bulk:
    patch:
      consumes:
      - application/json
      description: Relations (artists/tags/parodies/circles/characters) MERGE into
        what each archive already has rather than replacing it, so an archive keeps
        its own tags and gains the submitted ones; de-duplication is case-insensitive
        and submitted names are snapped to the spelling already in use. Because it
        only adds, an empty array is a no-op rather than "clear" and bulk removal
        is unsupported. Scalars (language/category) are SET, overwriting the current
        value; omit or null them to leave them alone, send "" to blank them. Title,
        summary and release_date are intentionally not editable here since they describe
        one specific archive - use PATCH /api/archives/{id} for those. Each archive
        is applied in its own transaction, so a failure part-way through leaves earlier
        archives updated and reports the rest in "failed".
      parameters:
      - description: Archives and relations to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.BulkUpdateArchivesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BulkResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Update shared metadata on archives in bulk
      tags:
      - archives
  /api/archives/bulk/metadata:
    post:
      consumes:
      - application/json
      description: 'Enqueues the same metadata job the scanner uses for newly added
        archives: local sources run first and are applied, then a remote job is chained
        to fill remaining gaps. Pass "source" to pin the fetch to a single named source
        instead, in which case only that source runs and nothing is chained; network-backed
        sources are queued on the low-concurrency worker so a large batch doesn''t
        hammer them. A source that is disabled for a given archive''s library is skipped
        rather than retried. Returns as soon as the jobs are queued - "succeeded"
        counts archives queued, not archives whose metadata has been written yet.
        Unlike the single-archive fetch endpoints there is no preview/confirm step,
        so results are applied automatically.'
      parameters:
      - description: Archives to identify, optionally pinned to one source
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.BulkMetadataRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.BulkResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Fetch and apply metadata for archives in bulk
      tags:
      - archives
  /api/archives/bulk/progress:
    put:
      consumes:
      - application/json
      description: Marking read jumps each archive to its own last page and flags
        it completed; marking unread deletes the progress row outright (page 0 would
        still count as in-progress). Ids that don't resolve to an archive are reported
        in "failed" rather than failing the request.
      parameters:
      - description: Archives and desired read state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.BulkProgressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BulkResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Mark archives read or unread in bulk
      tags:
      - archives
  /api/archives/categories:
    get:
