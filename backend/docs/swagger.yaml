basePath: /
definitions:
  handlers.ArchiveListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ArchiveResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.ArchiveResponse:
    properties:
      artists:
        items:
          type: string
        type: array
      category:
        type: string
      characters:
        items:
          type: string
        type: array
      circles:
        items:
          type: string
        type: array
      created_at:
        type: string
      file_path:
        type: string
      id:
        type: string
      language:
        type: string
      page_count:
        type: integer
      parodies:
        items:
          type: string
        type: array
      progress:
        $ref: '#/definitions/handlers.ProgressResponse'
      release_date:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      thumbs_ready:
        type: boolean
      title:
        type: string
      updated_at:
        type: string
    type: object
  handlers.CharacterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.CharacterResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.CharacterResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.CreateLibraryRequest:
    properties:
      name:
        type: string
      path:
        type: string
      type:
        type: string
    type: object
  handlers.LibraryResponse:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      path:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  handlers.LibrarySourceResponse:
    properties:
      api_key:
        type: string
      cookies:
        type: string
      enabled:
        type: boolean
      magazine_blocklist:
        items:
          type: string
        type: array
      misc_blocklist:
        items:
          type: string
        type: array
      source:
        type: string
    type: object
  handlers.LibraryTypeResponse:
    properties:
      supported:
        type: boolean
      type:
        type: string
    type: object
  handlers.ParodyListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ParodyResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.ParodyResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.ProgressResponse:
    properties:
      completed:
        type: boolean
      current_page:
        type: integer
      last_read:
        type: string
    type: object
  handlers.SortOptionResponse:
    properties:
      display_name:
        type: string
      value:
        type: string
    type: object
  handlers.TagListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.TagResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handlers.TagResponse:
    properties:
      count:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.UpdateLibraryRequest:
    properties:
      enabled:
        type: boolean
      name:
        type: string
    type: object
  handlers.UpdateLibrarySourceRequest:
    properties:
      api_key:
        type: string
      cookies:
        type: string
      enabled:
        type: boolean
      magazine_blocklist:
        items:
          type: string
        type: array
      misc_blocklist:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateTagDescriptionRequest:
    properties:
      description:
        type: string
    type: object
  metadata.Result:
    properties:
      artists:
        items:
          type: string
        type: array
      category:
        type: string
      characters:
        items:
          type: string
        type: array
      circles:
        items:
          type: string
        type: array
      language:
        type: string
      page_count:
        type: integer
      parodies:
        items:
          type: string
        type: array
      release_date:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  metadata.SearchResult:
    properties:
      cover_url:
        type: string
      full:
        allOf:
        - $ref: '#/definitions/metadata.Result'
        description: |-
          Full is populated lazily when the user selects this result.
          Nil until FetchByID is called.
      id:
        type: string
      language:
        type: string
      page_count:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  metadata.SourceInfo:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      priority:
        type: integer
    type: object
  response.Error:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Self-hosted doujinshi library manager API
  title: Shoka API
  version: "1.0"
paths:
  /api/admin/covers:
    post:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Enqueue cover generation for all archives
      tags:
      - admin
  /api/admin/libraries:
    post:
      consumes:
      - application/json
      parameters:
      - description: Library to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateLibraryRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Create a library
      tags:
      - admin
  /api/admin/libraries/{id}:
    delete:
      description: Cascade-deletes every archive and cached data belonging to this
        library. Does not touch files on disk.
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete a library
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: The library's path and type are immutable after creation.
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateLibraryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Rename or enable/disable a library
      tags:
      - admin
  /api/admin/libraries/{id}/scan:
    post:
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Trigger a scan of a single library
      tags:
      - admin
  /api/admin/libraries/{id}/sources:
    get:
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LibrarySourceResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a library's per-library metadata source settings
      tags:
      - admin
  /api/admin/libraries/{id}/sources/{source}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name (e.g. nhentai, e-hentai, comicinfo, filename)
        in: path
        name: source
        required: true
        type: string
      - description: Source settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateLibrarySourceRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LibrarySourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Configure a metadata source for a single library
      tags:
      - admin
  /api/archives:
    get:
      parameters:
      - description: Library ID to list archives from
        in: query
        name: library_id
        required: true
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 24
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Sort order (title_asc, title_desc, release_date_asc, release_date_desc,
          created_at_asc, created_at_desc, page_count_asc, page_count_desc)
        in: query
        name: sort
        type: string
      - collectionFormat: csv
        description: Filter by artist name(s); archive must have all
        in: query
        items:
          type: string
        name: artist
        type: array
      - collectionFormat: csv
        description: Filter by tag name(s); archive must have all
        in: query
        items:
          type: string
        name: tag
        type: array
      - collectionFormat: csv
        description: Filter by character name(s); archive must have all
        in: query
        items:
          type: string
        name: character
        type: array
      - collectionFormat: csv
        description: Filter by parody name(s); archive must have all
        in: query
        items:
          type: string
        name: parody
        type: array
      - description: Filter by language code (e.g. en, ja)
        in: query
        name: language
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List archives with pagination, filtering, and sorting
      tags:
      - archives
  /api/archives/{id}/cover:
    get:
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get the cover thumbnail for an archive
      tags:
      - archives
  /api/archives/{id}/pages/{index}:
    get:
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Page index (0-based)
        in: path
        name: index
        required: true
        type: integer
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a full-resolution page for an archive
      tags:
      - archives
  /api/archives/sort-options:
    get:
      description: Returns every valid value for the "sort" query param on GET /api/archives,
        with a display name for UI dropdowns
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.SortOptionResponse'
            type: array
      summary: List archive sort options
      tags:
      - archives
  /api/characters:
    get:
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CharacterListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List characters with pagination
      tags:
      - characters
  /api/characters/{id}:
    delete:
      parameters:
      - description: Character ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete a character
      tags:
      - characters
  /api/characters/{name}:
    get:
      parameters:
      - description: Character name
        in: path
        name: name
        required: true
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 24
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List archives for a character
      tags:
      - characters
  /api/characters/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.CharacterResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List every character
      tags:
      - characters
  /api/libraries:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LibraryResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List libraries
      tags:
      - libraries
  /api/libraries/types:
    get:
      description: Returns every library type known to the schema and whether it's
        currently supported (has a working scanner). Unsupported types are reserved
        for future use and are rejected by library creation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LibraryTypeResponse'
            type: array
      summary: List library types
      tags:
      - libraries
  /api/parodies:
    get:
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ParodyListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List parodies with pagination
      tags:
      - parodies
  /api/parodies/{id}:
    delete:
      parameters:
      - description: Parody ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete a parody
      tags:
      - parodies
  /api/parodies/{name}:
    get:
      parameters:
      - description: Parody name
        in: path
        name: name
        required: true
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 24
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List archives for a parody
      tags:
      - parodies
  /api/parodies/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ParodyResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List every parody
      tags:
      - parodies
  /api/tags:
    get:
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TagListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List tags with pagination
      tags:
      - tags
  /api/tags/{id}:
    delete:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete a tag
      tags:
      - tags
    patch:
      consumes:
      - application/json
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      - description: Description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateTagDescriptionRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Update a tag's description
      tags:
      - tags
  /api/tags/{name}:
    get:
      parameters:
      - description: Tag name
        in: path
        name: name
        required: true
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 24
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List archives for a tag
      tags:
      - tags
  /api/tags/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TagResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List every tag
      tags:
      - tags
  /archives/{id}:
    get:
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a single archive
      tags:
      - archives
  /archives/{id}/metadata:
    post:
      description: Runs the full metadata pipeline for the given archive and applies
        results
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/metadata.Result'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Fetch metadata for an archive
      tags:
      - metadata
  /archives/{id}/metadata/{source}:
    post:
      description: Runs a single named metadata source for the given archive
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name (e.g. e-hentai, nhentai, comicinfo.xml)
        in: path
        name: source
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/metadata.Result'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Fetch metadata from a specific source
      tags:
      - metadata
  /archives/{id}/metadata/{source}/{source_id}:
    post:
      description: Fetches full metadata by source-specific ID and applies it to the
        archive
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name
        in: path
        name: source
        required: true
        type: string
      - description: Source-specific result ID
        in: path
        name: source_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Apply metadata from a specific source result
      tags:
      - metadata
  /archives/{id}/metadata/{source}/search:
    get:
      description: Returns a list of candidates from a remote source for manual selection
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name
