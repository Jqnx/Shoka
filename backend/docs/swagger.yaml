        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get the current user's reader settings
      tags:
      - reader-settings
    patch:
      consumes:
      - application/json
      description: Partial update - omitted fields keep their current (or default)
        value. Creates the row on first call.
      parameters:
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateReaderSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReaderSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Update the current user's reader settings
      tags:
      - reader-settings
  /api/search:
    get:
      description: Substring match (min 3 characters - shorter values return every
        category empty) over each category's name, scoped to a single library for
        the archives category. Artist/tag/parody/circle/character are global entities
        (not library-scoped), so those four categories search the whole install. Each
        category is independently capped at `limit` and separately counted via its
        `total`, for a "N more" affordance per category.
      parameters:
      - description: Library ID to scope the archive category to
        in: query
        name: library_id
        required: true
        type: string
      - description: Search query (substring match, min 3 characters)
        in: query
        name: q
        required: true
        type: string
      - default: 5
        description: Max results per category
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Search across archives, artists, tags, parodies, circles and characters
      tags:
      - search
  /api/tags:
    get:
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TagListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List tags with pagination
      tags:
      - tags
  /api/tags/{id}:
    delete:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Delete a tag
      tags:
      - tags
    patch:
      consumes:
      - application/json
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      - description: Description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateTagDescriptionRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Update a tag's description
      tags:
      - tags
  /api/tags/{name}:
    get:
      parameters:
      - description: Tag name
        in: path
        name: name
        required: true
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 24
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List archives for a tag
      tags:
      - tags
  /api/tags/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TagResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List every tag
      tags:
      - tags
  /archives/{id}:
    get:
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get a single archive
      tags:
      - archives
  /archives/{id}/metadata:
    post:
      description: Runs the full metadata pipeline for the given archive and applies
        results
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/metadata.Result'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Fetch metadata for an archive
      tags:
      - metadata
  /archives/{id}/metadata/{source}:
    post:
      description: Runs a single named metadata source for the given archive
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name (e.g. e-hentai, nhentai, comicinfo.xml)
        in: path
        name: source
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/metadata.Result'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Fetch metadata from a specific source
      tags:
      - metadata
  /archives/{id}/metadata/{source}/{source_id}:
    post:
      description: Fetches full metadata by source-specific ID and returns a preview
        of the archive as it would look with that metadata applied — it does NOT save
        anything. Use PATCH /api/archives/{id} to actually persist the (possibly user-edited)
        values.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name
        in: path
        name: source
        required: true
        type: string
      - description: Source-specific result ID
        in: path
        name: source_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArchiveResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Preview metadata from a specific source result
      tags:
      - metadata
  /archives/{id}/metadata/{source}/search:
    get:
      description: Returns a list of candidates from a remote source for manual selection
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      - description: Source name
        in: path
        name: source
        required: true
        type: string
      - description: Override search query (defaults to archive title)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/metadata.SearchResult'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Error'
      summary: Search a metadata source
      tags:
      - metadata
  /archives/{id}/metadata/save:
    post:
      description: Writes current metadata as ComicInfo.xml into the archive file
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Save metadata to archive
      tags:
      - metadata
  /metadata/sources:
    get:
      description: Returns all registered metadata sources and their enabled state
        for a library
      parameters:
      - description: Library ID
        in: query
        name: library_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/metadata.SourceInfo'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
      summary: List metadata sources
      tags:
      - metadata
  /test:
    get:
      description: Example Description
      parameters:
      - description: example
        in: query
        name: example
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
      summary: Test
      tags:
      - test
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
