services:
  psql_bp:
    image: postgres:latest
    restart: unless-stopped
    networks:
      - shoka
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - shoka
    ports:
      - "${REDIS_PORT}:6379"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    networks:
      - shoka
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info

volumes:
  psql_volume:

networks:
  shoka:
    external: false
